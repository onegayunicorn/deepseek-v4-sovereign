<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sovereign Orchestrator — Telemetry Dashboard</title>
<meta name="description" content="Live telemetry dashboard for the Sovereign Orchestrator: quantum fidelity, DNA resonance, AGI fleet, registry and deployment status.">
<link rel="canonical" href="https://onegayunicorn.github.io/deepseek-v4-sovereign/dashboard.html">
<style>
  :root{
    --bg:#0b1020; --bg2:#111830; --panel:#141c38; --line:#263055;
    --text:#e8ecf8; --muted:#9aa6c8; --dim:#6b76a0;
    --cyan:#4fd8e0; --blue:#5b8cff; --green:#5ad1a0; --amber:#f2b45c;
    --grad:linear-gradient(135deg,#4fd8e0,#5b8cff);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
  a{color:var(--blue);text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
  header{display:flex;align-items:center;gap:18px;padding:22px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:20px;font-weight:600}
  header .spacer{flex:1}
  #clock{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  #conn{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--green);color:var(--green)}
  #conn.offline{border-color:var(--amber);color:var(--amber)}
  .grid{display:grid;gap:14px;margin:22px 0}
  .metrics{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .card .label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .card .value{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.4px}
  .card .value small{font-size:13px;color:var(--muted);font-weight:400}
  .card .note{font-size:12px;color:var(--muted);margin-top:2px}
  .c-cyan{color:var(--cyan)} .c-blue{color:var(--blue)} .c-green{color:var(--green)} .c-amber{color:var(--amber)}
  .charts{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .chart-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .chart-box h3{font-size:14px;font-weight:500;color:var(--muted);margin-bottom:12px}
  .chart-box .track{height:12px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin-bottom:8px}
  .chart-box .fill{height:100%;border-radius:99px;background:var(--grad);transition:width .6s ease}
  .chart-box .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:12px}
  .chart-box .row b{color:var(--text);font-weight:500}
  footer{margin-top:40px;border-top:1px solid var(--line);padding:18px 0 32px;color:var(--dim);font-size:12px;display:flex;gap:18px;flex-wrap:wrap}
  #lastUpdated{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚛ Sovereign Orchestrator — Telemetry</h1>
    <div class="spacer"></div>
    <span id="conn">● live</span>
    <span id="clock">—</span>
  </header>

  <div class="grid metrics" id="metrics"></div>

  <div class="grid charts">
    <div class="chart-box"><h3>Quantum & DNA resonance</h3><div id="qchart"></div></div>
    <div class="chart-box"><h3>AGI fleet</h3><div id="achart"></div></div>
    <div class="chart-box"><h3>Registry & quality</h3><div id="rchart"></div></div>
  </div>

  <footer>
    <span id="lastUpdated">last update: —</span>
    <span>source: site/telemetry.json · rev <b id="rev">—</b></span>
    <span><a href="index.html">← back to landing</a></span>
  </footer>
</div>

<script>
"use strict";
const EMBEDDED = {"generated_at":"2026-08-08T00:00:00Z","revision":"7b2b996","status":"operational","modules":{"quantum":{"bell_pairs":847,"mean_fidelity":0.999422,"lineage_generations":12},"bio":{"dna_awakening_pct":86.6,"kaleidoscope_permutations":65536},"agi":{"agents":42,"bots":2650,"council_seated":10},"teleos":{"links":847,"mean_fidelity":0.999423},"neural":{"bci_carrier_hz":432},"pero":{"spdc_efficiency_pct":67.3,"spatial_coherence_pct":81.7,"entanglement_hold_s":1.6}},"quality":{"tests_passed":29,"tests_total":29,"benchmark_groups_passed":4,"registry_valid":true},"registry":{"yaml_files":90,"registry_files":12,"task_types":10,"workflows":2},"deployment":{"wheel":"sovereign-0.1.0-py3-none-any.whl","exe_size_mb":91,"ios":true,"apk":true,"docker":true}};

let T = EMBEDDED;
async function load(){
  try{
    const r = await fetch('telemetry.json', {cache:'no-store'});
    if(r.ok){ T = await r.json(); document.getElementById('conn').className=''; }
  }catch(e){ document.getElementById('conn').classList.add('offline'); document.getElementById('conn').textContent='● embedded'; }
  render();
}
function el(id,v){ const n=document.getElementById(id); if(n) n.textContent=v; }
function card(label,value,note,cls){
  return `<div class="card"><div class="label">${label}</div><div class="value ${cls||''}">${value}</div><div class="note">${note||''}</div></div>`;
}
function barChart(rows){
  return rows.map(r=>`
    <div class="row"><span>${r.name}</span><b>${r.val}${r.suffix||''}</b></div>
    <div class="track"><div class="fill" style="width:${r.pct}%"></div></div>
  `).join('');
}
function render(){
  const m=T.modules||{}, q=m.quantum||{}, b=m.bio||{}, a=m.agi||{}, tl=m.teleos||{}, n=m.neural||{}, p=m.pero||{}, ql=m.quality||T.quality||{};
  document.getElementById('metrics').innerHTML =
    card('Bell pairs', q.bell_pairs, `F ${q.mean_fidelity}`,'c-cyan') +
    card('DNA awakening', b.dna_awakening_pct+'%','threshold 80%','c-green') +
    card('Agents', a.agents, `+ ${a.bots} bots`,'c-blue') +
    card('Council', a.council_seated||10, 'seated','c-amber') +
    card('TeleOS links', tl.links, `F ${tl.mean_fidelity}`,'c-cyan') +
    card('BCI carrier', (n.bci_carrier_hz||432)+' Hz','phase-locked','c-green') +
    card('Tests', (ql.tests_passed||29)+'/'+(ql.tests_total||29),'all pass','c-blue') +
    card('Status', (T.status||'operational').toUpperCase(),'v'+ (T.revision||''),'c-amber');
  document.getElementById('qchart').innerHTML = barChart([
    {name:'Bell pair fidelity', val:'F '+q.mean_fidelity, pct:99.94},
    {name:'DNA awakening', val:b.dna_awakening_pct+'%', pct:b.dna_awakening_pct},
    {name:'SPDC efficiency', val:(p.spdc_efficiency_pct||67.3)+'%', pct:p.spdc_efficiency_pct||67.3},
    {name:'Spatial coherence', val:(p.spatial_coherence_pct||81.7)+'%', pct:p.spatial_coherence_pct||81.7},
  ]);
  document.getElementById('achart').innerHTML = barChart([
    {name:'Specialized agents', val:a.agents, pct:100},
    {name:'Worker bots', val:a.bots, pct:100},
    {name:'Council seated', val:a.council_seated||10, pct:100},
    {name:'Kaleidoscope perms', val:(b.kaleidoscope_permutations||65536).toLocaleString(), pct:100},
  ]);
  document.getElementById('rchart').innerHTML = barChart([
    {name:'Tests passed', val:ql.tests_passed+'/'+ql.tests_total, pct:100},
    {name:'Benchmark groups', val:ql.benchmark_groups_passed+'/4', pct:100},
    {name:'Task types', val:(T.registry&&T.registry.task_types)||10, pct:100},
    {name:'Workflows', val:(T.registry&&T.registry.workflows)||2, pct:100},
  ]);
  el('rev', T.revision||'—');
  el('lastUpdated','last update: '+(T.generated_at||'—'));
  el('clock', new Date().toISOString().replace('T',' ').slice(0,19)+' UTC');
  setInterval(()=>el('clock', new Date().toISOString().replace('T',' ').slice(0,19)+' UTC'),1000);
}
load();
</script>
</body>
</html>
