# Inference config — runtime settings
inference:
  default_quant: Q4_K_M
  context_size: 2048
  n_predict: 256
  temperature: 0.7
  top_p: 0.9
  threads: auto
  backend_priority:
    - llama.cpp
    - ollama
    - docker
    - transformers
  audit:
    enabled: true
    log_jailbreak_indicators: true
    log_channel: "security"
