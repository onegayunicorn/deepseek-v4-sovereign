[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign"
version = "0.1.0"
description = "SOVEREIGN — self-sovereign AI orchestrator (FastAPI API + CLI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sovereign AI (onegayunicorn)" }]
keywords = ["orchestrator", "ai", "sovereign", "deepseek", "fastapi", "cli", "bci"]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "typer>=0.12,<1.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "cryptography>=42.0",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyinstaller>=6.6",
]

[project.scripts]
sovereign = "sovereign.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sovereign = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
