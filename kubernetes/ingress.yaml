apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sovereign-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "sovereign-api"
spec:
  rules:
    - host: orchestrator.sovereign.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sovereign-api
                port: { number: 8000 }
