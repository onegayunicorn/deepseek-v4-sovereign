apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-orchestrator
  labels: { app: sovereign }
spec:
  replicas: 2
  selector:
    matchLabels: { app: sovereign }
  template:
    metadata:
      labels: { app: sovereign }
    spec:
      containers:
        - name: api
          image: sovereign/orchestrator:0.1.0
          ports:
            - { containerPort: 8000 }
          env:
            - { name: SOVEREIGN_MODE, value: "production" }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: sovereign-secrets, key: jwt-secret }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 4Gi }
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: logs, mountPath: /app/logs }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: sovereign-data }
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sovereign-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 20Gi }
