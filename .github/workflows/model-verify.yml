name: Model Verify

on:
  push:
    paths:
      - "models/gemma-3-12b-it-jailbreak/**"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml
      - name: Run module tests
        run: python -m pytest models/gemma-3-12b-it-jailbreak/tests -q
