name: HF Sync

on:
  push:
    paths:
      - "models/gemma-3-12b-it-jailbreak/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install huggingface_hub
      - name: Sync model card metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/monorepo_sync.py
