name: "Build Sovereign Binaries"

on:
  push: { branches: [main] }
  release: { types: [published] }
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          cd builds/apk
          chmod +x gradlew
          ./gradlew clean assembleRelease
          mv app/build/outputs/apk/release/app-release-unsigned.apk ../../dist/Sovereign.apk
      - uses: actions/upload-artifact@v4
        with: { name: Sovereign.apk, path: dist/Sovereign.apk }

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build EXE
        run: |
          pip install -r requirements.txt pyinstaller pywin32
          cd builds/exe
          pyinstaller sovereign.spec --clean
          mv dist/Sovereign.exe ../../dist/Sovereign.exe
      - uses: actions/upload-artifact@v4
        with: { name: Sovereign.exe, path: dist/Sovereign.exe }

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build iOS (toolchain generates the Xcode project)
        run: |
          bash scripts/build_ios.sh
          if [ -f builds/ios/build/Sovereign.ipa ]; then
            mv builds/ios/build/Sovereign.ipa dist/Sovereign.ipa
          fi
      - uses: actions/upload-artifact@v4
        with: { name: Sovereign.ipa, path: dist/Sovereign.ipa }

  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build DEB
        run: bash scripts/build_linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: Sovereign.deb, path: dist/Sovereign.deb }

  web-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WASM
        run: bash scripts/build_web.sh
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy-release:
    needs: [apk, exe, ios, linux-deb, web-wasm]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Sovereign.apk/Sovereign.apk
            Sovereign.exe/Sovereign.exe
            Sovereign.ipa/Sovereign.ipa
            Sovereign.deb/Sovereign.deb

  # NOTE: GitHub Pages is deployed by .github/workflows/pages.yml directly
  # (its own push trigger) — not called from here.
