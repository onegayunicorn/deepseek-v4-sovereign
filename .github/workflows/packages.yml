name: Packages

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build wheel
        run: |
          pip install --upgrade pip build
          python -m build --wheel
      - name: Verify wheel contents
        run: |
          python - <<'EOF'
          import zipfile, glob
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          for pkg in ("sovereign/", "quantum/", "bio/", "agi/", "zenith/", "teleos/", "neural/", "pero/"):
              assert any(n.startswith(pkg) for n in names), f"missing {pkg}"
          print("wheel OK — all modules packaged")
          EOF
      - uses: actions/upload-artifact@v4
        with: { name: sovereign-wheel, path: dist/*.whl }

  exe-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build Linux onefile binary
        run: bash builds/exe/build_exe.sh
      - uses: actions/upload-artifact@v4
        with: { name: sovereign-exe-linux, path: builds/exe/dist/sovereign }

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Install Android SDK
        run: |
          echo "$ANDROID_HOME" || true
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --licenses >/dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Build APK
        run: |
          cd builds/apk
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew :app:assembleDebug; \
          else gradle :app:assembleDebug; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sovereign-apk
          path: builds/apk/app/build/outputs/apk/**/*.apk

  ios:
    runs-on: macos-14
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build iOS simulator app
        run: |
          bash builds/ios/build_ios.sh || true
        env:
          RELEASE: "0"
